// ── このファイルの役目（2026-10-18 学習用に追記）────────────────────────────
// 端末アプリ（app モジュール）の Gradle 設定。VLM（画像つきの LLM）の検証アプリ（org.edgeslm.vlm。EdgeSLM_AndroidVLM）。
// 決めていること: Android の版（compileSdk・minSdk・targetSdk）、アプリの ID、C++ の推論部（runner）のビルド、
//   .so の詰め方（C-6）、ONNX Runtime（QNN EP 入り）の取り込み。
// 入力: src/main/（Kotlin・C++・マニフェスト）、src/main/jniLibs/arm64-v8a/（QNN の .so）、libs/（ORT の .aar）。
// 出力: app/build/outputs/apk/debug/app-debug.apk（検証は debug の APK だけを使う）。
// 動かし方（このファイルの 1 つ上のフォルダで。ルートの build.gradle の冒頭も参照）:
//   $env:JAVA_HOME="D:\Android\jdk17"; .\gradlew.bat --offline assembleDebug
//   adb install -r app\build\outputs\apk\debug\app-debug.apk
// ─────────────────────────────────────────────────────────────────────────
// 版はルートの build.gradle で決めてあり、ここでは「使う」とだけ書く。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // namespace: Kotlin のパッケージ名・R クラスの置き場。C++ の JNI 関数名（Java_org_edgeslm_…）もこれに縛られるので、
    //   アプリを複製しても変えない（変えるのは下の applicationId だけ）。
    namespace 'org.edgeslm.demo'
    // compileSdk 34: Android 14 の API でコンパイルする。
    compileSdk 34
    // NDK は gradle.properties で固定（ZipDepth と同一）。新しい版に上げない。
    ndkVersion project.property('ndk.version')

    defaultConfig {
        // ★EdgeSLM_AndroidVLM 用の別アプリ（2026-09-29）。EdgeSLM_AndroidGemma4 のアプリ（org.edgeslm.gemma4）を複製し、
        //   applicationId だけ変えた。端末では Gemma4 のアプリ・同僚向けのデモ（org.edgeslm.demo）と共存し、プロセスも別
        //   （NPU の上限もプロセスごと）。namespace（Kotlin のパッケージ・JNI の関数名）は変えない
        //   複製元: ../EdgeSLM_AndroidGemma4/android_app（ファイルごとの md5 は android_app/COPY_MANIFEST.md5）
        applicationId 'org.edgeslm.vlm'
        // minSdk 26（Android 8.0）以上の端末に入る。targetSdk 34 は「Android 14 の決まりで動く」の宣言
        //   （Foreground Service の種類の宣言などがマニフェストに要るのはこのため）。
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-vlm'
        ndk {
            // 対象端末は arm64 のみ。他 ABI はビルド時間と APK サイズの無駄。
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // nlohmann/json と std::string を使うため STL が必要。
                // 単一のネイティブライブラリしか持たないので static で十分（余計な .so を増やさない）。
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // C++ の推論部（JNI・ORT のセッション・生成のループ）を CMake で作る。CMakeLists.txt が libedgeslm_runner.so を作り、
            //   Kotlin の NativeBridge が System.loadLibrary("edgeslm_runner") で読む。
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            // ★C-6（要件定義書 3.4節）
            // FastRPC は V68 skeleton に「通常のファイルシステムパス」を要求する。
            // これを true にするとマニフェストに extractNativeLibs="true" が入り、
            // インストール時に .so が実ファイルとして展開される。
            // false（AGP の現代の既定）だと APK から直接 mmap されパスが存在しなくなり、
            // FastRPC が skeleton を開けない。
            useLegacyPackaging = true
        }
    }

    // debug の APK は adb で中のファイルを見られる（debuggable）。release は作っていない（検証では使わない）。
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    // Java 17 で作る（JDK 17 でビルドするため。README の JAVA_HOME）。
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ONNX Runtime 1.27.0（QNN EP 入り）。
    // v0.1 では ZipDepth 同梱物をそのまま使う＝「持ち込むのは自分のコードだけ」にして
    // 失敗時の切り分けを runner 側に限定する（基本設計③ 8.2節）。
    // jniLibs の QNN ランタイム（QAIRT 2.48 セット）と版を揃えること（FR-12）。
    implementation files('libs/onnxruntime-android-qnn-1.27.0.aar')
}
